# Shared case table for the credential readback classifier.
# `records_value_landed` is key presence, not value.
# The classifier compares strings, so these are markers rather than credential-shaped literals: this
# file syncs to the public repo, where a code- or card-shaped value reads as a real secret.
cases:
  - name: O1_one_time_code_lands_intact
    readback: "marker-value-one"
    typed_value: "marker-value-one"
    outcome: exact_match
    fails: false
    records_value_landed: true
  - name: O1b_password_lands_intact
    readback: "marker-value-two"
    typed_value: "marker-value-two"
    outcome: exact_match
    fails: false
    records_value_landed: true
  - name: O2_field_truncated_to_part_of_what_was_typed
    readback: "marker-val"
    typed_value: "marker-value-one"
    outcome: different
    fails: false
    records_value_landed: false
  - name: O3_field_inserts_its_own_separators
    readback: "alpha beta gamma"
    typed_value: "alphabetagamma"
    outcome: different
    fails: false
    records_value_landed: false
  - name: O4_field_is_empty_after_the_fill
    readback: ""
    typed_value: "marker-value-one"
    outcome: empty
    fails: true
    records_value_landed: false
  - name: O4b_field_holds_only_whitespace
    readback: "   "
    typed_value: "marker-value-one"
    outcome: empty
    fails: true
    records_value_landed: false
  - name: O5_field_could_not_be_read
    readback: null
    typed_value: "marker-value-one"
    outcome: unavailable
    fails: false
    records_value_landed: false
  - name: O8_tool_layer_placeholder_is_never_a_match
    readback: "[REDACTED_SECRET]"
    typed_value: "marker-value-one"
    outcome: different
    fails: false
    records_value_landed: false
  - name: O11_maxlength_truncates_the_typed_value
    readback: "marker-value-lo"
    typed_value: "marker-value-longer"
    outcome: different
    fails: false
    records_value_landed: false
  - name: O12_wrong_empty_field_reads_back_what_was_typed
    readback: "marker-value-one"
    typed_value: "marker-value-one"
    outcome: exact_match
    fails: false
    records_value_landed: true
  - name: case_difference_is_not_a_match
    readback: "hello world"
    typed_value: "Hello World"
    outcome: different
    fails: false
    records_value_landed: false
  - name: a_blank_typed_value_landing_exactly_is_a_match
    readback: "   "
    typed_value: "   "
    outcome: exact_match
    fails: false
    records_value_landed: true
