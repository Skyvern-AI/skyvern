title: Review card e2e rep1
description: Read the member statement from the member portal (local QA fixture).
proxy_location: NONE
persist_browser_session: false
reuse_browser_session: false
mask_secrets: false
pin_saved_session_ip: false
workflow_definition:
  version: 2
  parameters: []
  blocks:
    - block_type: extraction
      label: read_statement_number
      next_block_label: read_amount_due
      continue_on_failure: false
      ignore_workflow_system_prompt: false
      next_loop_on_failure: false
      data_extraction_goal: Read the statement number shown in the members area.
      url: http://localhost:8941/cookie_session_portal/members
      title: ''
      engine_pinned: false
      data_schema:
        type: object
        properties:
          statement_number:
            type: string
      max_retries: 0
      disable_cache: false
      export_enabled: false
    - block_type: extraction
      label: read_amount_due
      continue_on_failure: false
      ignore_workflow_system_prompt: false
      next_loop_on_failure: false
      data_extraction_goal: Read the amount due shown in the members area.
      title: ''
      engine_pinned: false
      data_schema:
        type: object
        properties:
          amount_due:
            type: string
      max_retries: 0
      disable_cache: false
      export_enabled: false
is_saved_task: false
status: published
run_with: agent
ai_fallback: true
cache_key: default
adaptive_caching: false
enable_self_healing: false
code_version: 2
generate_script_on_terminal: false
run_sequentially: false
