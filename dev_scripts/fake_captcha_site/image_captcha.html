<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Page - Image-Based Captcha</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .captcha-box { background: #f0f0f0; border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 4px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #dff0d8; color: #3c763d; }
        .error { background: #f2dede; color: #a94442; }
        .captcha-image-container { text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Record Search</h1>
    <p>Enter information below to search public records.</p>

    <form id="searchForm" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter first name">
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter last name">
        </div>

        <div class="captcha-box">
            <p>Type the characters you see in the image below:</p>
            <div class="captcha-image-container">
                <svg id="captchaImage" width="200" height="60" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="60" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
                </svg>
            </div>
            <div class="form-group">
                <label for="captchaAnswer">Enter Captcha</label>
                <input type="text" id="captchaAnswer" name="captchaAnswer" placeholder="Type the characters shown above">
            </div>
        </div>

        <button type="submit">Search</button>
    </form>

    <div id="result" class="result"></div>

    <script>
        function generateCaptchaText(length) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }

        function renderCaptchaSVG(text) {
            const svg = document.getElementById('captchaImage');
            // Clear existing text elements
            while (svg.childNodes.length > 1) {
                svg.removeChild(svg.lastChild);
            }

            // Add noise lines
            for (let i = 0; i < 5; i++) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', Math.random() * 200);
                line.setAttribute('y1', Math.random() * 60);
                line.setAttribute('x2', Math.random() * 200);
                line.setAttribute('y2', Math.random() * 60);
                line.setAttribute('stroke', `hsl(${Math.random()*360}, 30%, 70%)`);
                line.setAttribute('stroke-width', '1');
                svg.appendChild(line);
            }

            // Add characters with distortion
            for (let i = 0; i < text.length; i++) {
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                const x = 20 + i * 30;
                const y = 35 + (Math.random() * 15 - 7);
                const rotation = Math.random() * 30 - 15;
                t.setAttribute('x', x);
                t.setAttribute('y', y);
                t.setAttribute('font-size', `${22 + Math.random() * 8}`);
                t.setAttribute('font-family', 'monospace');
                t.setAttribute('fill', `hsl(${Math.random()*360}, 50%, 35%)`);
                t.setAttribute('transform', `rotate(${rotation}, ${x}, ${y})`);
                t.textContent = text[i];
                svg.appendChild(t);
            }
        }

        let captchaText = generateCaptchaText(6);
        renderCaptchaSVG(captchaText);

        function validateForm() {
            const userAnswer = document.getElementById('captchaAnswer').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            if (userAnswer.toLowerCase() === captchaText.toLowerCase()) {
                resultDiv.className = 'result success';
                resultDiv.textContent = 'Captcha verified successfully! Search results would appear here.';
            } else {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Incorrect captcha. Try again.`;
                captchaText = generateCaptchaText(6);
                renderCaptchaSVG(captchaText);
                document.getElementById('captchaAnswer').value = '';
            }
            return false;
        }
    </script>
</body>
</html>
