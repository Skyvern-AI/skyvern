name: Run tests and pre-commit
# Run this job on pushes to `main`, and for pull requests. If you don't specify
# `branches: [main], then this actions runs _twice_ on pull requests, which is
# annoying.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Run tests and pre-commit hooks
    runs-on: ubuntu-latest
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: skyvern
          POSTGRES_DATABASE: skyvern
          POSTGRES_HOST_AUTH_METHOD: trust
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
          fetch-depth: 0
      # If you wanted to use multiple Python versions, you'd have specify a matrix in the job and
      # reference the matrixe python version here.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Install blog validator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps
          markdown-it-py==4.2.0 linkify-it-py==2.0.3
          mdit-py-plugins==0.6.1 mdurl==0.1.2 uc-micro-py==2.0.0
      - name: Validate blog content
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_ref="${PR_BASE_SHA:-}"
          if [[ -z "$base_ref" && -n "${PUSH_BASE_SHA:-}" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_ref="$PUSH_BASE_SHA"
          elif [[ -z "$base_ref" ]] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          fi

          guarded_paths=(
            blogs/
            .github/sync.yml
            .github/workflows/ci.yml
            scripts/validate_blog_content.py
            scripts/tests/test_validate_blog_content.py
            scripts/blog_content_contract.json
            scripts/blog_content_bootstrap_hashes.json
            scripts/blog_content_published_slugs.txt
          )

          if [[ -n "$base_ref" ]] && git cat-file -e "${base_ref}:scripts/validate_blog_content.py" 2>/dev/null; then
            trusted_root="$RUNNER_TEMP/blog-validator-base"
            rm -rf "$trusted_root"
            mkdir -p "$trusted_root"
            base_archive_paths=("${guarded_paths[@]:1}")
            while IFS= read -r path; do
              relative_path="${path#blogs/}"
              if [[ "$relative_path" == *.md && "$relative_path" != */* ]]; then
                base_archive_paths+=("$path")
              fi
            done < <(git ls-tree -r --name-only "$base_ref" -- blogs/)
            git archive "$base_ref" -- "${base_archive_paths[@]}" | tar -xf - -C "$trusted_root"

            (
              cd "$trusted_root"
              python3 -m unittest -v scripts.tests.test_validate_blog_content
            )
            python3 "$trusted_root/scripts/validate_blog_content.py" \
              --root "$GITHUB_WORKSPACE" \
              --base-root "$trusted_root"
            exit 0
          fi

          python3 -m unittest -v scripts.tests.test_validate_blog_content
          validator_args=(--root "$GITHUB_WORKSPACE" --bootstrap)
          if python3 -c 'import json; from pathlib import Path; raise SystemExit(json.loads(Path("scripts/blog_content_contract.json").read_text())["bootstrapComplete"] is not False)'; then
            validator_args+=(--pre-apply)
          fi
          if [[ -n "$base_ref" ]]; then
            validator_args+=(--base-ref "$base_ref")
          fi
          python3 scripts/validate_blog_content.py "${validator_args[@]}"
      # Install uv (fast, single-file binary)
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      # Cache uv's download/resolve cache to speed up CI (optional but nice)
      - name: Cache uv global cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
      # Cache the project virtualenv (keyed by Python version + lockfile)
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version || '3.11' }}-${{ hashFiles('**/uv.lock') }}
      # Create/refresh the environment (installs main + dev groups)
      - name: Sync deps with uv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv lock
          uv sync --extra server --group dev
      # Ensure venv is current even on cache hit (cheap no-op if up to date)
      - name: Ensure environment is up to date
        if: steps.cache-venv.outputs.cache-hit == 'true'
        run: |
          uv sync --extra server --group dev
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skyvern-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: skyvern-frontend
        run: npm ci
      # Finally, run pre-commit.
      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files
        env:
          ENABLE_OPENAI: "true"
          OPENAI_API_KEY: "sk-dummy"
          ENABLE_AZURE_GPT4O_MINI: "true"
          AZURE_GPT4O_MINI_DEPLOYMENT: "dummy"
          AZURE_GPT4O_MINI_API_KEY: "dummy"
          AZURE_GPT4O_MINI_API_BASE: "dummy"
          AZURE_GPT4O_MINI_API_VERSION: "dummy"
          AWS_REGION: "us-east-1"
          ENABLE_BEDROCK: "true"
      - name: Run alembic check
        env:
          ENABLE_OPENAI: "true"
          OPENAI_API_KEY: "sk-dummy"
          ENABLE_AZURE_GPT4O_MINI: "true"
          AZURE_GPT4O_MINI_DEPLOYMENT: "dummy"
          AZURE_GPT4O_MINI_API_KEY: "dummy"
          AZURE_GPT4O_MINI_API_BASE: "dummy"
          AZURE_GPT4O_MINI_API_VERSION: "dummy"
          AWS_REGION: "us-east-1"
          ENABLE_BEDROCK: "true"
        run: uv run ./run_alembic_check.sh
      - name: trigger tests
        env:
          ENABLE_OPENAI: "true"
          OPENAI_API_KEY: "sk-dummy"
          AWS_ACCESS_KEY_ID: "dummy"
          AWS_SECRET_ACCESS_KEY: "dummy"
        run: uv run pytest
  fe-lint-build:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skyvern-frontend
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run build
        run: npm run build
  pip-package-smoke:
    name: pip Package Smoke Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache uv global cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skyvern-frontend/package-lock.json
      - name: Run pip package smoke tests
        run: PYTHON_IMAGE=python:${{ matrix.python-version }}-slim scripts/test-pip-ui-package.sh

