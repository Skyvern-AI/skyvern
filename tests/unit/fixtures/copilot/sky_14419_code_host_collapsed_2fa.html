<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two-factor authentication · Wyrmhold</title>
  </head>
  <body>
    <main>
      <h1>Two-factor authentication</h1>
      <p>Authenticate using your passkey.</p>
      <button class="primary">Use passkey</button>
      <button
        class="secondary"
        aria-expanded="false"
        aria-controls="two-factor-alternatives-body"
      >
        More options ▾
      </button>
      <ul id="two-factor-alternatives-body" hidden>
        <li><button>Authenticator app</button></li>
      </ul>
    </main>
  </body>
</html>
